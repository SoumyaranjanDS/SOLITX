name: Deploy SOLITX Infrastructure (Frontend & Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Files to VPS via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/solitx"
          EXCLUDE: "/frontend/node_modules/, /backend/node_modules/, /.git/"

      - name: Restart Backend with PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if ! command -v pm2 &> /dev/null; then sudo npm install -g pm2; fi
            cd /var/www/solitx/backend
            npm install --omit=dev
            
            # Restart if exists, otherwise start fresh
            pm2 describe solitx-api > /dev/null
            if [ $? -eq 0 ]; then
              pm2 restart solitx-api
            else
              pm2 start src/server.js --name solitx-api
            fi
            pm2 save
